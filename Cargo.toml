[package]
name = "rust-desktop-icons"
version = "0.3.0"
edition = "2024"
description = "Rust Desktop Icons - An Alternative To Fences 6"
license = "MIT"
repository = "https://github.com/vincentxjoubert-lang/rust-desktop-icons"
authors = ["vincentxjoubert-lang"]
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Globalization", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell_Common"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
